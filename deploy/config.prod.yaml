# 운영 설정 템플릿. deploy.sh가 ${DOMAIN}을 치환해 config.yaml로 만든다.
# 비밀값(ANTHROPIC_API_KEY, LINKUD_AUTH_TOKENS)은 여기 넣지 않는다 → SSM → .env
gateway:
  host: 0.0.0.0
  port: 8000
  db_path: /data/linkud.db
  allowed_hosts: ["${DOMAIN}"]
  judge: claude
  judge_model: claude-haiku-5-5
  no_supply_info: partial
  supply_enabled: true
downstreams: []
  # - name: example
  #   url: https://mcp.example.com/mcp
  #   registry: io.github.example/server
