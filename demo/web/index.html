<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 비서를 지키는 문지기</title>
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body data-busy="1">
  <main class="stage">
    <section class="app" aria-label="AI 비서 (재현 화면)">
      <header class="app-head">
        <div class="app-name">
          <span class="app-icon" aria-hidden="true"></span>
          <span>AI 비서</span>
        </div>
        <div class="app-tools">
          <span class="app-tools-label">연결된 도구:</span>
          <ul id="tools" class="tool-chips"></ul>
          <span id="guard" class="guard" hidden></span>
        </div>
      </header>

      <div id="chat" class="chat" aria-live="polite"></div>

      <footer class="composer">
        <div id="composer" class="composer-box" aria-label="메시지 입력창"></div>
        <span class="composer-send" aria-hidden="true">보내기</span>
      </footer>
    </section>

    <div id="staged-badge" class="staged-badge">재현 화면 <span id="judge"></span></div>
  </main>

  <section id="cover" class="overlay" aria-label="표지">
    <h1 class="cover-title">같은 부탁, 다른 결과</h1>
    <p class="cover-sub">AI 비서가 도구를 믿는 순간 생기는 일, 그리고 그 앞의 문지기</p>
  </section>

  <section id="finale" class="overlay" aria-label="마무리" hidden>
    <div id="finale-body" class="finale"></div>
  </section>

  <nav class="nav" aria-label="장면 넘기기">
    <button id="prev" type="button" aria-label="이전">‹</button>
    <button id="next" type="button" aria-label="다음">›</button>
  </nav>

  <aside id="notes" class="notes" aria-label="발표자 메모" hidden>
    <div class="notes-head">발표자 메모 <span class="notes-key">N 키로 닫기</span></div>
    <div id="notes-body" class="notes-body"></div>
  </aside>
</body>
</html>
