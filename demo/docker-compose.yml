# 비전공 청중용 시연 환경 (demo/README.md)
#   docker compose -f demo/docker-compose.yml up --build
#   → 브라우저로 http://127.0.0.1:8080 (DEMO_PORT로 바꿀 수 있음)
#
# 호스트에 여는 포트는 nginx의 127.0.0.1 한 개뿐이다. 게이트웨이·시연 MCP 서버·드라이버는 포트를 열지 않는다.
# 네트워크:
#   back   (내부 전용) 게이트웨이·드라이버 ↔ 시연 MCP 서버. 인터넷으로 나갈 수 없다
#   front  (내부 전용) nginx ↔ 게이트웨이(관리 API 조회)·드라이버
#   edge   nginx만. 호스트 포트를 열기 위한 네트워크
#   egress 게이트웨이만. ANTHROPIC_API_KEY가 있을 때 AI 판사(Claude API) 호출용
# 토큰은 secrets 서비스가 띄울 때마다 새로 만들어 볼륨에 둔다(레포·이 파일에 토큰 없음).
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-mcp-server: &mcp-server
  <<: *hardening
  build: {context: .., dockerfile: demo/servers/Dockerfile}
  networks: [back]
  mem_limit: 128m
  pids_limit: 64

services:
  secrets:
    <<: *hardening
    # python:3.12-slim (다이제스트 고정, 2026-10-27 기준)
    image: python:3.12-slim@sha256:12316debbfb86890f6b2d825820612741ba527ad5a44e3902759141d572bfe8f
    user: "0"
    cap_add: [CHOWN]
    network_mode: none
    volumes:
      - demo-secrets:/run/demo-secrets
      - ./init_secrets.py:/init_secrets.py:ro
    command: ["python", "/init_secrets.py", "/run/demo-secrets"]

  translator:
    <<: *mcp-server
    environment: {DEMO_ROLE: translator}
  notes:
    <<: *mcp-server
    environment: {DEMO_ROLE: notes}
  rugpull:
    <<: *mcp-server
    environment: {DEMO_ROLE: rugpull}

  gateway:
    <<: *hardening
    build: {context: .., dockerfile: deploy/Dockerfile}
    entrypoint: ["sh", "/demo/start.sh"]
    command: []
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - demo-secrets:/run/demo-secrets:ro
      - ./gateway:/demo:ro
    tmpfs: [/tmp]
    networks: [back, front, egress]
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 256
    depends_on:
      secrets: {condition: service_completed_successfully}
      translator: {condition: service_started}
      notes: {condition: service_started}
      rugpull: {condition: service_started}

  driver:
    <<: *hardening
    build: {context: .., dockerfile: demo/driver/Dockerfile}
    # 에이전트 토큰은 파일에서 읽어 이 프로세스의 환경변수(LINKUD_AGENT_TOKEN)로만 넘긴다
    command: ["sh", "-c", "LINKUD_AGENT_TOKEN=\"$$(cat /run/demo-secrets/agent)\" exec python demo_driver.py"]
    environment:
      # 드라이버는 API 키를 받지 않는다. 키가 있는지만 게이트웨이와 같은 조건으로 안다
      DEMO_JUDGE: ${ANTHROPIC_API_KEY:+claude}
    volumes:
      - demo-secrets:/run/demo-secrets:ro
    networks: [back, front]
    mem_limit: 256m
    pids_limit: 64
    depends_on:
      secrets: {condition: service_completed_successfully}
      gateway: {condition: service_started}

  nginx:
    <<: *hardening
    # nginx:1.27-alpine (다이제스트 고정, 2026-10-27 기준)
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    cap_add: [CHOWN, SETUID, SETGID]
    # 관리 토큰은 nginx가 서버 쪽에서만 붙인다(페이지·JS에는 없음). 템플릿 치환에 쓰도록 환경변수로 읽는다
    entrypoint:
      - sh
      - -c
      # 토큰 파일을 못 읽으면 시작하지 않는다(fail-closed). /run은 아래 tmpfs(/var/run)에 가려지므로 다른 경로에 둔다
      - DEMO_ADMIN_TOKEN="$$(cat /demo-secrets/admin.nginx)" && export DEMO_ADMIN_TOKEN && exec /docker-entrypoint.sh nginx -g 'daemon off;'
    volumes:
      - demo-secrets:/demo-secrets:ro
      - ./nginx/demo.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./web:/usr/share/nginx/demo:ro
    tmpfs: [/etc/nginx/conf.d, /var/cache/nginx, /var/run, /tmp]
    ports: ["127.0.0.1:${DEMO_PORT:-8080}:8080"]
    networks: [front, edge]
    depends_on:
      secrets: {condition: service_completed_successfully}
      gateway: {condition: service_started}
      driver: {condition: service_started}

networks:
  back: {internal: true}
  front: {internal: true}
  edge: {}
  egress: {}

volumes:
  demo-secrets:
