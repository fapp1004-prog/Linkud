# 시연용 게이트웨이 설정 (judge: fake). start.sh가 ANTHROPIC_API_KEY 유무로 fake/claude 중 하나를 고른다.
# 두 파일은 judge 한 줄만 다르다 (tests/test_demo_config.py가 확인)
gateway:
  host: 0.0.0.0
  port: 8000
  # Docker 네트워크 안에서 드라이버가 http://gateway:8000 으로 붙는다
  allowed_hosts: ["gateway:8000"]
  db_path: /tmp/linkud.db   # tmpfs: 띄울 때마다 새로 시작
  judge: fake
  judge_timeout: 20
  supply_enabled: false     # 시연 서버는 Registry에 없다
  no_supply_info: record
downstreams:
  - {name: translator, url: "http://translator:9000/mcp"}
  - {name: notes, url: "http://notes:9000/mcp"}
  - {name: rugpull, url: "http://rugpull:9000/mcp"}
