# 약속 2 — 채점 규칙은 이 파일 하나에 모은다. (셋이 같이 관리, 바꾸면 단톡에 먼저 공유하고 PR로)
# 판정 순서와 의미는 docs/SPEC.md 5장.
#
#   1) 검사기 에러·시간 초과  → 제한
#   2) 하드 룰(차단)          → 차단
#   3) 하드 룰(최소 제한)     → 점수가 높아도 최소 제한
#   4) 점수                   → 신뢰점수 = 100 - Σ(risk × weight)

weights:            # 검사기별 중요도 (합치면 1). D6 성적 측정 후 조정, 바꾼 값과 이유는 SPEC 결정 기록에 남긴다
  injection: 0.6
  supply_chain: 0.25
  identity: 0.15

thresholds:
  allow: 80         # 80점 이상 → 허용
  restrict: 50      # 50~79점 → 제한(사람 승인), 50점 미만 → 차단

hard_rules:
  block_if_hard_block: true       # 검사기가 hard_block=True를 주면 차단
  block_if_confidence_at_least: 0.8   # B의 confidence가 이 값 이상이면 차단
  restrict_if_signals:            # 이 신호가 하나라도 있으면 최소 제한
    - critical_vuln
    - identity_changed
  on_checker_error: restrict      # 검사기 에러·시간 초과 → 제한 (fail-closed: 절대 '허용'으로 떨어지지 않게)

checkers:
  timeout_seconds: 10             # 검사기 하나당 최대 시간. 넘으면 에러로 취급
