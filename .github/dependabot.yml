# 의존성 업데이트 PR 자동 생성. Actions는 SHA로 고정돼 있어도 Dependabot이 SHA·버전 주석을 함께 올린다.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}

  # uv.lock (pyproject.toml) — uv 생태계가 잠금 파일까지 갱신한다
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 10
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  # 베이스 이미지 다이제스트 고정(deploy/Dockerfile, 테스트 서버·시연 이미지)도 갱신 PR로 따라간다
  - package-ecosystem: docker
    directories: [/deploy, /tests/fixtures/poisoned_servers, /demo/servers, /demo/driver]
    schedule: {interval: weekly}
