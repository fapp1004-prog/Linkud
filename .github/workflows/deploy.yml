name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/linkud

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=${IMAGE,,}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.IMAGE }}:latest

  deploy:
    # EC2 시크릿이 없으면 이미지만 올리고 배포 단계는 건너뛴다
    needs: image
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      DOMAIN: ${{ secrets.LINKUD_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
        if: env.EC2_HOST != ''
      - name: SSH 키 설정
        if: env.EC2_HOST != ''
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.EC2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: 배포 파일 복사
        if: env.EC2_HOST != ''
        run: |
          scp -r deploy/docker-compose.yml deploy/nginx deploy/*.sh deploy/config.prod.yaml \
            "${EC2_USER}@${EC2_HOST}:/opt/linkud/"
      - name: 배포
        if: env.EC2_HOST != ''
        run: |
          ssh "${EC2_USER}@${EC2_HOST}" \
            "cd /opt/linkud && LINKUD_IMAGE='${{ needs.image.outputs.image }}' DOMAIN='${DOMAIN}' ./deploy.sh"
      - name: 건너뜀 안내
        if: env.EC2_HOST == ''
        run: echo "EC2_HOST 시크릿이 없어 배포를 건너뜀 (docs/deploy.md 참고)"
