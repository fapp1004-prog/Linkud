# 대안 배포: GitHub OIDC로 AWS 임시 자격 증명을 받고 SSM Run Command로 EC2에서 deploy.sh를 실행한다.
# 22번 포트·SSH 키·장기 AWS 키가 필요 없다. 설정 방법과 신뢰 정책은 docs/deploy.md 6장.
# 주의: 실제 AWS 계정에서 동작을 검증하지 않은 파일이다.
name: Deploy (OIDC + SSM)

on:
  workflow_dispatch:
    inputs:
      image:
        description: "배포할 이미지 (비우면 ghcr.io/<owner>/linkud:latest)"
        required: false

permissions:
  contents: read
  id-token: write  # OIDC 토큰 발급

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 신뢰 정책의 sub를 main 브랜치로 고정했으므로 main에서만 실행한다
    if: github.ref == 'refs/heads/main'
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      DOMAIN: ${{ secrets.LINKUD_DOMAIN }}
    steps:
      - name: 설정 확인
        id: check
        run: |
          if [ -z "$AWS_ROLE_ARN" ] || [ -z "$INSTANCE_ID" ]; then
            echo "AWS_DEPLOY_ROLE_ARN·EC2_INSTANCE_ID 시크릿이 없어 배포를 건너뜀 (docs/deploy.md 6장)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.check.outputs.skip != 'true'
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.check.outputs.skip != 'true'
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: linkud-deploy-${{ github.run_id }}
      - name: SSM Run Command로 배포
        if: steps.check.outputs.skip != 'true'
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          image="${IMAGE:-ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/linkud:latest}"
          # 배포 파일을 압축해 명령에 실어 보낸다 (SSH·S3 없이). 수 KB라 SSM 파라미터 한도 안
          bundle="$(tar czf - -C deploy docker-compose.yml nginx deploy.sh fetch-secrets.sh init-letsencrypt.sh config.prod.yaml | base64 -w0)"
          params="$(jq -n --arg b "$bundle" --arg img "$image" --arg dom "$DOMAIN" '{commands: [
            "set -euo pipefail",
            "mkdir -p /opt/linkud",
            ("echo " + $b + " | base64 -d | tar xzf - -C /opt/linkud"),
            ("cd /opt/linkud && sudo -u ubuntu env LINKUD_IMAGE=" + ($img|@sh) + " DOMAIN=" + ($dom|@sh) + " ./deploy.sh")
          ]}')"
          cmd_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "linkud deploy ${GITHUB_SHA::12}" \
            --parameters "$params" \
            --query Command.CommandId --output text)"
          echo "SSM 명령: $cmd_id"
          # 완료까지 기다린다 (실패하면 wait가 0이 아닌 값으로 끝남)
          aws ssm wait command-executed --command-id "$cmd_id" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}' --output json
          status="$(aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" --query Status --output text)"
          test "$status" = "Success"
