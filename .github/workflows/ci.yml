name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.11.32"
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest -q
      - name: 의존성 취약점 검사 (pip-audit)
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements.txt
          uvx pip-audit==2.7.3 -r requirements.txt --disable-pip --progress-spinner off

  image-scan:
    # 배포 이미지 빌드 → syft SBOM 첨부 → Trivy 취약점 스캔
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 이미지 빌드
        run: docker build -f deploy/Dockerfile -t linkud:ci .
      - name: SBOM 생성 (syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: linkud:ci
          format: cyclonedx-json
          output-file: linkud-image.cdx.json
          upload-artifact: false
      - name: SBOM 첨부
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linkud-image-sbom
          path: linkud-image.cdx.json
      - name: 이미지 취약점 스캔 (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: linkud:ci
          # 취약점만 본다. 비밀값 스캐너는 anthropic SDK 문서 문자열의 예시
          # '"type": "service_account"'를 GCP 서비스 계정 키로 오탐한다(실제 비밀값 아님)
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

  docker-smoke:
    # 오염 테스트 서버를 컨테이너로 띄우고 게이트웨이가 걸러내는지 확인한다
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.11.32"
      - run: uv sync --frozen
      - name: 오염 테스트 서버 + 게이트웨이 기동
        run: docker compose -f tests/fixtures/poisoned_servers/docker-compose.yml up -d --build
        env:
          LINKUD_AUTH_TOKENS: smoke-token
      - name: 스모크 테스트
        run: uv run python eval/docker_smoke.py
        env:
          LINKUD_AUTH_TOKENS: smoke-token
      - name: 실패 시 로그
        if: failure()
        run: docker compose -f tests/fixtures/poisoned_servers/docker-compose.yml logs --tail 200
      - name: 정리
        if: always()
        run: docker compose -f tests/fixtures/poisoned_servers/docker-compose.yml down -v
