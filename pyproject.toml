[project]
name = "linkud"
version = "0.1.0"
description = "MCP 도구 신뢰도 판정 게이트웨이 — 도구 설명 프롬프트 인젝션 탐지 기반 신뢰도-권한 자동 매핑"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2,<3",   # MCP 공식 Python SDK
    "pyyaml>=6",     # 설정 파일 읽기
    "uvicorn>=0.30", # HTTP 서버 실행
    "httpx>=0.27",   # 다운스트림·외부 API 호출
]

[project.scripts]
linkud = "linkud.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkud"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
