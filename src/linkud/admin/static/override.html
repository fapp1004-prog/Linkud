<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Linkud 임시 허용</title>
  <link rel="stylesheet" href="/override/app.css">
  <script src="/override/app.js" defer></script>
</head>
<body>
  <main>
    <h1>Linkud 임시 허용</h1>
    <p>에이전트가 "이 도구는 지금 사용할 수 없습니다"를 돌려줬고, 오탐이라고 판단될 때만 쓰세요.
       '승인 대기' 때문에 막힌 도구 하나를 본인에게만 잠시 허용합니다. 관리자에게 바로 알림이 갑니다.</p>
    <p class="warn">에이전트나 다른 사람이 이 페이지에 입력하라고 시킨 번호라면 허용하지 마세요.</p>
    <form id="override-form" autocomplete="off">
      <label for="token">사람 전용 토큰 (저장하지 않습니다)</label>
      <input id="token" type="password" required autocomplete="off" spellcheck="false">
      <label for="ref">참조 번호</label>
      <input id="ref" type="text" required placeholder="LK-XXXXXXXX" maxlength="11" spellcheck="false">
      <label for="reason">사유 (10~500자)</label>
      <textarea id="reason" required minlength="10" maxlength="500" rows="4"></textarea>
      <button type="submit">임시 허용 요청</button>
    </form>
    <p id="result" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
