# Docker 네트워크 안에서 오염 테스트 서버들에 붙는 게이트웨이 설정
gateway:
  host: 0.0.0.0
  port: 8000
  db_path: /tmp/linkud.db
  judge: fake            # ANTHROPIC_API_KEY가 있으면 claude로 바꿔 실제 판별
  supply_enabled: false  # 테스트 서버는 Registry에 없다
  no_supply_info: record
downstreams:
  - {name: poisoned, url: "http://poisoned:9000/mcp"}
  - {name: judge, url: "http://judge:9000/mcp"}
  - {name: rugpull, url: "http://rugpull:9000/mcp"}
  - {name: mixed, url: "http://mixed:9000/mcp"}
